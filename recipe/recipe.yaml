schema_version: 1

context:
  version: "1.7.0"

package:
  name: biotite
  version: ${{ version }}

source:
  - url: https://github.com/biotite-dev/biotite/archive/v${{ version }}.tar.gz
    sha256: 6ff1b2550571798956e43ccbd9268f6985a251e9b8343d2e5c96791933f95d20
  - url: https://github.com/biotite-dev/biotite/releases/download/v${{ version }}/components.bcif
    sha256: 69c097244159a124544e9291fba0f167de45ab6a89f4b2e3e5750ccf03dd445f
    target_directory: src/biotite/structure/info/

build:
  skip:
    - match(python, "<3.11")
  number: 0
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
    - hatch-cython
    - wheel >=0.30
    - cython >=3.0
    - numpy >=2.0,<2.4
  run:
    - python
    - biotraj >=1.0,<2.0
    - requests >=2.12
    - numpy >=1.26,<2.4
    - msgpack-python
    - networkx >=2.0

tests:
  - files:
      source:
        - tests/
    requirements:
      run:
        - pytest
    script: pytest tests//structure tests//sequence

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: A comprehensive library for computational molecular biology
  homepage: https://www.biotite-python.org/
  repository: https://github.com/biotite-dev/biotite
  documentation: https://www.biotite-python.org/

extra:
  recipe-maintainers:
    - t0mdavid-m
    - padix-key
